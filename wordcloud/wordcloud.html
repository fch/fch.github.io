    <title>On the Descriptive Complexity of Vertex Deletion Problems</title>
    <updated>2024-06-26T12:32:09Z</updated>
    <link href="https://arxiv.org/abs/2406.18299v1" rel="alternate" type="text/html"/>
    <link href="https://arxiv.org/pdf/2406.18299v1" rel="related" type="application/pdf" title="pdf"/>
    <summary>Vertex deletion problems for graphs are studied intensely in classical and parameterized complexity theory. They ask whether we can delete at most k vertices from an input graph such that the resulting graph has a certain property. Regarding k as the parameter, a dichotomy was recently shown based on the number of quantifier alternations of first-order formulas that describe the property. In this paper, we refine this classification by moving from quantifier alternations to individual quantifier patterns and from a dichotomy to a trichotomy, resulting in a complete classification of the complexity of vertex deletion problems based on their quantifier pattern. The more fine-grained approach uncovers new tractable fragments, which we show to not only lie in FPT, but even in parameterized constant-depth circuit complexity classes. On the other hand, we show that vertex deletion becomes intractable already for just one quantifier per alternation, that is, there is a formula of the form {\forall}x{\exists}y{\forall}z(ψ), with ψ quantifier-free, for which the vertex deletion problem is W[1]-hard. The fine-grained analysis also allows us to uncover differences in the complexity landscape when we consider different kinds of graphs and more general structures: While basic graphs (undirected graphs without self-loops), undirected graphs, and directed graphs each have a different frontier of tractability, the frontier for arbitrary logical structures coincides with that of directed graphs.</summary>

    <id>http://arxiv.org/abs/2603.22043v1</id>
    <title>The Descriptive Complexity of Relation Modification Problems</title>
    <updated>2026-03-23T14:42:49Z</updated>
    <link href="https://arxiv.org/abs/2603.22043v1" rel="alternate" type="text/html"/>
    <link href="https://arxiv.org/pdf/2603.22043v1" rel="related" type="application/pdf" title="pdf"/>
    <summary>A relation modification problem gets a logical structure and a natural number k as input and asks whether k modifications of the structure suffice to make it satisfy a predefined property. We provide a complete classification of the classical and parameterized complexity of relation modification problems - the latter w. r. t. the modification budget k - based on the descriptive complexity of the respective target property. We consider different types of logical structures on which modifications are performed: Whereas monadic structures and undirected graphs without self-loops each yield their own complexity landscapes, we find that modifying undirected graphs with self-loops, directed graphs, or arbitrary logical structures is equally hard w. r. t. quantifier patterns.
  Moreover, we observe that all classes of problems considered in this paper are subject to a strong dichotomy in the sense that they are either very easy to solve (that is, they lie in paraAC^{0uparrow} or TC^0) or intractable (that is, they contain W[2]-hard or NP-hard problems).</summary>
    <category term="cs.LO" scheme="http://arxiv.org/schemas/atom"/>

    <id>http://arxiv.org/abs/2110.00562v1</id>
    <title>Computational Complexity of Deciding Provability in Linear Logic and its Fragments</title>
    <updated>2021-09-28T21:13:19Z</updated>
    <link href="https://arxiv.org/abs/2110.00562v1" rel="alternate" type="text/html"/>
    <link href="https://arxiv.org/pdf/2110.00562v1" rel="related" type="application/pdf" title="pdf"/>
    <summary>Linear logic was conceived in 1987 by Girard and, in contrast to classical logic, restricts the usage of the structural inference rules of weakening and contraction. With this, atoms of the logic are no longer interpreted as truth, but as information or resources. This interpretation makes linear logic a useful tool for formalisation in mathematics and computer science. Linear logic has, for example, found applications in proof theory, quantum logic, and the theory of programming languages. A central problem of the logic is the question whether a given list of formulas is provable with the calculus. In the research regarding the complexity of this problem, some results were achieved, but other questions are still open. To present these questions and give new perspectives, this thesis consists of three main parts which build on each other: We present the syntax, proof theory, and various approaches to a semantics for linear logic. Here already, we will meet some open research questions. We present the current state of the complexity-theoretic characterization of the most important fragments of linear logic. Here, further research problems are presented and it becomes apparent that until now, the results have all made use of different approaches. We prove an original complexity characterization of a fragment of the logic and present ideas for a new, structural approach to the examination of provability in linear logic.</summary>
    <category term="cs.LO" scheme="http://arxiv.org/schemas/atom"/>
    <category term="cs.CC" scheme="http://arxiv.org/schemas/atom"/>
    <published>2021-09-28T21:13:19Z</published>
    <arxiv:primary_category term="cs.LO"/>

      <name>Florian Chudigiewitsch</name>

    <id>http://arxiv.org/abs/2310.01134v1</id>
    <title>Existential Second-Order Logic Over Graphs: Parameterized Complexity</title>
    <updated>2023-10-02T12:20:28Z</updated>
    <link href="https://arxiv.org/abs/2310.01134v1" rel="alternate" type="text/html"/>
    <link href="https://arxiv.org/pdf/2310.01134v1" rel="related" type="application/pdf" title="pdf"/>
    <summary>By Fagin's Theorem, NP contains precisely those problems that can be described by formulas starting with an existential second-order quantifier, followed by only first-order quantifiers (ESO formulas). Subsequent research refined this result, culminating in powerful theorems that characterize for each possible sequence of first-order quantifiers how difficult the described problem can be. We transfer this line of inquiry to the parameterized setting, where the size of the set quantified by the second-order quantifier is the parameter. Many natural parameterized problems can be described in this way using simple sequences of first-order quantifiers: For the clique or vertex cover problems, two universal first-order quantifiers suffice ("for all pairs of vertices ... must hold"); for the dominating set problem, a universal followed by an existential quantifier suffice ("for all vertices, there is a vertex such that ..."); and so on. We present a complete characterization that states for each possible sequence of first-order quantifiers how high the parameterized complexity of the described problems can be. The uncovered dividing line between quantifier sequences that lead to tractable versus intractable problems is distinct from that known from the classical setting, and it depends on whether the parameter is a lower bound on, an upper bound on, or equal to the size of the quantified set.</summary>
    <category term="cs.LO" scheme="http://arxiv.org/schemas/atom"/>
    <category term="cs.CC" scheme="http://arxiv.org/schemas/atom"/>

    <id>http://arxiv.org/abs/2603.22063v1</id>
    <title>On the Complexity of Fundamental Problems for DAG-Compressed Graphs</title>
    <updated>2026-03-23T14:57:34Z</updated>
    <link href="https://arxiv.org/abs/2603.22063v1" rel="alternate" type="text/html"/>
    <link href="https://arxiv.org/pdf/2603.22063v1" rel="related" type="application/pdf" title="pdf"/>
    <summary>A DAG compression of a (typically dense) graph is a simple data structure that stores how vertex clusters are connected, where the clusters are described indirectly as sets of reachable sinks in a directed acyclic graph (DAG). They generalize tree compressions, where the clusters form a tree-like hierarchy, and we give the first proof that DAG compressions can achieve better compressions than tree compressions. Our interest in DAG compression stems from the fact that several simple standard algorithms, like breadth-first search on graphs, can be implemented so that they work directly on the compressed rather than on the original graph and so that, crucially, the runtime is relative to the (typically small) size of the compressed graph. We add another entry to the list of algorithms where this is possible, by showing that Kruskal's algorithm for computing minimum spanning trees can be adapted to work directly on DAG compressions. On the negative side, we answer the central open problem from previous work, namely how hard it is to compute a minimum-size DAG compression for a given graph: This is NP-hard; and this is even the case for the dynamic setting, where we must update the DAG compression optimally when a single edge is added or deleted in the input graph.</summary>

    <title>Logical Characterization of Algebraic Circuit Classes over Integral Domains</title>
    <updated>2023-02-27T13:45:33Z</updated>
    <link href="https://arxiv.org/abs/2302.13764v1" rel="alternate" type="text/html"/>
    <link href="https://arxiv.org/pdf/2302.13764v1" rel="related" type="application/pdf" title="pdf"/>
    <summary>We present an adapted construction of algebraic circuits over the reals introduced by Cucker and Meer to arbitrary infinite integral domains and generalize the $\mathrm{AC}_{\mathbb{R}}$ and $\mathrm{NC}_{\mathbb{R}}$-classes for this setting. We give a theorem in the style of Immerman's theorem which shows that for these adapted formalisms, sets decided by circuits of constant depth and polynomial size are the same as sets definable by a suitable adaptation of first-order logic. Additionally, we discuss a generalization of the guarded predicative logic by Durand, Haak and Vollmer and we show characterizations for the $\mathrm{AC}_{R}$ and $\mathrm{NC}_{R}$ hierarchy. Those generalizations apply to the Boolean $\mathrm{AC}$ and $\mathrm{NC}$ hierarchies as well. Furthermore, we introduce a formalism to be able to compare some of the aforementioned complexity classes with different underlying integral domains.</summary>

    <summary>Large networks are useful in a wide range of applications. Sometimes problem instances are composed of billions of entities. Decomposing and analyzing these structures helps us gain new insights about our surroundings. Even if the final application concerns a different problem (such as traversal, finding paths, trees, and flows), decomposing large graphs is often an important subproblem for complexity reduction or parallelization. This report is a summary of discussions that happened at Dagstuhl seminar 23331 on "Recent Trends in Graph Decomposition" and presents currently open problems and future directions in the area of (hyper)graph decomposition.</summary>

// 0.01 + 0.15 * Math.floor(Math.log(10 + 20 * Math.floor(Math.log(d.size))))

function groupSimilar(arr) {
    return arr.reduce((acc, val) => {
        const { data, map } = acc;
        const ind = map.get(val);
        if (map.has(val)) {
            data[ind][1]++;
        } else {
            map.set(val, data.push([val, 1]) - 1);
        }
        return { data, map };
    }, {
        data: [],
        map: new Map()
    }).data;
};
